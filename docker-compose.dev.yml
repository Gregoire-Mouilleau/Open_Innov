services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: techfarm_postgres_dev
    environment:
      POSTGRES_USER: techfarm
      POSTGRES_PASSWORD: techfarm_dev
      POSTGRES_DB: techfarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techfarm -d techfarm"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: techfarm_mongo_dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: techfarm
      MONGO_INITDB_ROOT_PASSWORD: techfarm_dev
      MONGO_INITDB_DATABASE: techfarm
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db

volumes:
  postgres_dev_data:
  mongo_dev_data:
