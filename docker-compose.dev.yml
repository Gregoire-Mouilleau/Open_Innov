services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: techfarm_postgres_dev
    env_file:
      - ./backend_next/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techfarm -d techfarm"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: techfarm_mongo_dev
    env_file:
      - ./backend_next/.env
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: techfarm_minio_dev
    env_file:
      - ./backend_next/.env
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"   # API S3 (9000 occupé par Hadoop namenode)
      - "9001:9001"   # Console web
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  mongo_dev_data:
  minio_dev_data:
